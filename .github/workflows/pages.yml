name: Publish Posta in agenda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.ENTRA_CLIENT_ID != '' && vars.MICROSOFT_TENANT_ID != '' && vars.ARCHIVE_API_ENDPOINT != '' && vars.ARCHIVE_API_SCOPE != '' && vars.SUPABASE_ANON_KEY != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare app configuration
        env:
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          TENANT_ID: ${{ vars.MICROSOFT_TENANT_ID }}
          API_ENDPOINT: ${{ vars.ARCHIVE_API_ENDPOINT }}
          API_SCOPE: ${{ vars.ARCHIVE_API_SCOPE }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          values = {
              "clientId": os.environ["ENTRA_CLIENT_ID"],
              "tenantId": os.environ["TENANT_ID"],
              "redirectUri": f"https://{os.environ['REPOSITORY_OWNER']}.github.io/{os.environ['REPOSITORY_NAME']}/",
              "apiEndpoint": os.environ["API_ENDPOINT"],
              "apiScope": os.environ["API_SCOPE"],
              "supabaseAnonKey": os.environ["SUPABASE_ANON_KEY"],
          }
          missing = [key for key, value in values.items() if not value]
          if missing:
              raise SystemExit("Missing repository variables: " + ", ".join(missing))
          Path("config.js").write_text(
              "window.APP_CONFIG = " + json.dumps(values, indent=2) + ";\n",
              encoding="utf-8",
          )
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

