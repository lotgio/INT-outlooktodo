name: Publish Posta in agenda

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.ARCHIVE_API_ENDPOINT != '' && vars.SUPABASE_ANON_KEY != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare app configuration
        env:
          API_ENDPOINT: ${{ vars.ARCHIVE_API_ENDPOINT }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          values = {
              "apiEndpoint": os.environ["API_ENDPOINT"],
              "supabaseAnonKey": os.environ["SUPABASE_ANON_KEY"],
          }
          missing = [key for key, value in values.items() if not value]
          if missing:
              raise SystemExit("Missing repository variables: " + ", ".join(missing))
          Path("config.js").write_text(
              "window.APP_CONFIG = " + json.dumps(values, indent=2) + ";\n",
              encoding="utf-8",
          )
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
